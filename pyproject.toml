[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woo-mcp-connector"
version = "0.2.0"
description = "Read-only WooCommerce connector exposed as MCP tools (built for an Agent Studio style agent)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",  # Current MCP v2 stable line
    "httpx>=0.27",
    "pydantic>=2.6",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mcp[cli]>=2.0,<3",
]

[project.scripts]
woo-mcp = "woo_connector.mcp.server:main"
woo-connector = "woo_connector.cli:main"
merchantops-api = "woo_connector.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/woo_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
